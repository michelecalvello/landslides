<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landslide Blog 2024-2026 - event map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fff;--fg:#1f2933;--mut:#617080;--line:#d9dee3;--panel:#f6f7f9;--a:#c0392b;--b:#e67e22;--c:#5d6d7e;--d:#2e86c1}
@media (prefers-color-scheme:dark){:root{--bg:#1b1f24;--fg:#e6e9ec;--mut:#9aa6b2;--line:#333b44;--panel:#232930}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:14px/1.4 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg)}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
#head{padding:12px 14px;border-bottom:1px solid var(--line)}
#head h1{font-size:16px;margin:0 0 4px}
#head p{margin:0;color:var(--mut);font-size:12px}
#ctl{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
#ctl input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
#ctl label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
#count{font-size:12px;color:var(--mut)}
#list{overflow:auto;flex:1;min-height:0}
.item{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:rgba(127,127,127,.12)}
.item b{display:block;font-size:13px}
.item span{color:var(--mut);font-size:12px}
#map{height:100%;min-height:300px}
.pop{font-size:13px;max-width:290px}
.pop h3{margin:0 0 4px;font-size:14px}
.pop .m{color:#555;font-size:12px;margin:2px 0}
.tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:11px;background:#eee;color:#333;margin-right:4px}
.tag.ap{background:#fff2cc}
.legend{background:var(--bg);color:var(--fg);padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:1.7}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:44vh 1fr}#side{border-right:0;border-bottom:1px solid var(--line)}}
</style></head>

 </div>

</aside>

ear": 2026, "postdate": "2026-08-17"}, {"id": 222, "date": "18 Aug 2026", "cert": "Certain", "loc": "Zamboye (Zamboï) gold mining site, Central African Republic", "ev": "Gold mine landslide", "lat": 5.888, "lon": 14.55, "prec": "Estimated by me (place/region)", "pnote": "Low precision: Garoua-Boulai, the town the mine is close to; author is unsure of the mine's location", "link": "https://eos.org/thelandslideblog/zamboye-1", "others": [], "notes": "", "year": 2026, "postdate": "2026-08-20"}, {"id": 223, "date": "26 Aug 2026", "cert": "Certain", "loc": "Langtang Lirung, Nepal (debris flow into Nepal and Tibet)", "ev": "Catastrophic landslide and debris flow", "lat": 28.2765, "lon": 85.5194, "prec": "Stated in post", "pnote": "Initiating event of the debris flow (Langtang Lirung)", "link": "https://eos.org/thelandslideblog/26-august-2026-nepal-and-tibet", "others": ["https://eos.org/thelandslideblog/nepal-tibet-2", "https://eos.org/thelandslideblog/2026-nepal-landslide-the-2023-teesta-valley-glof", "https://eos.org/thelandslideblog/nepal-landslide-precursory-behaviour", "https://eos.org/thelandslideblog/langtang-lirung-1", "https://eos.org/thelandslideblog/high-resolution-pleiades-satellite-imagery-of-the-26-august-2026-langtang-lirung-landslide-in-nepal"], "notes": "Six posts on this event; the first is the primary link", "year": 2026, "postdate": "2026-08-26"}, {"id": 224, "date": "31 Aug 2026", "cert": "Certain", "loc": "Rason City, North Korea", "ev": "Rainfall-triggered landslides and debris flows", "lat": 42.3, "lon": 130.3, "prec": "Estimated by me (place/region)", "pnote": "Rason City area", "link": "https://eos.org/thelandslideblog/rason-1", "others": [], "notes": "", "year": 2026, "postdate": "2026-10-06"}, {"id": 225, "date": "~21-22 Sep 2026 (approximate)", "cert": "Approximate", "loc": "Kanto region, Japan (Kanagawa and Chiba prefectures)", "ev": "Multiple fatal landslides from Typhoon Dujuan", "lat": 35.3, "lon": 139.85, "prec": "Estimated by me (place/region)", "pnote": "Centre of the affected area around Tokyo Bay (Kanagawa and Chiba); landslides spread over several prefectures", "link": "https://eos.org/thelandslideblog/typhoon-dujuan-1", "others": [], "notes": "No exact date in the post; post dated 22 Sep 2026", "year": 2026, "postdate": "2026-09-22"}, {"id": 226, "date": "27 Sep 2026", "cert": "Certain", "loc": "Kaligandaki River, Nepal", "ev": "Landslide", "lat": 28.63113, "lon": 83.61219, "prec": "Stated in post (approximate)", "pnote": "Author says location is hard to pin down", "link": "https://eos.org/thelandslideblog/kaligandaki-river-landslide-1", "others": [], "notes": "", "year": 2026, "postdate": "2026-09-29"}, {"id": 227, "date": "9 Oct 2026", "cert": "Certain", "loc": "Azuero Peninsula, Panama", "ev": "Landslides triggered by the Mw 7.7 earthquake (2,351 mapped per news reports)", "lat": 7.47737, "lon": -80.86495, "prec": "Stated in post", "pnote": "Densest cluster of landslides; epicentre at 7.587, -80.769", "link": "https://eos.org/thelandslideblog/9-october-2026-panama-earthquake", "others": [], "notes": "", "year": 2026, "postdate": "2026-10-21"}, {"id": 228, "date": "11 Oct 2026", "cert": "Certain", "loc": "Budhi Gandaki River, Gorkha district, Nepal", "ev": "Landslide and debris flow/flood", "lat": 28.4755, "lon": 84.9644, "prec": "Stated in post (approximate)", "pnote": "Chumchet, where the landslide is thought to have occurred", "link": "https://eos.org/thelandslideblog/the-11-october-2026-landslide-and-debris-flow-flood-on-the-budhi-gandaki-river-in-gorkha-district-nepal", "others": [], "notes": "", "year": 2026, "postdate": "2026-10-12"}];
const COL = {a:'#c0392b', b:'#e67e22', d:'#2e86c1', c:'#5d6d7e'};
const cat = y => y===2026 ? 'a' : (y===2025 ? 'b' : (y===2024 ? 'd' : 'c'));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map = L.map('map', {worldCopyJump:true}).setView([20,10],2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap contributors &copy; CARTO', subdomains:'abcd', maxZoom:18}).addTo(map);
const group = L.layerGroup().addTo(map);
const est = d => d.prec.indexOf('Estimated') === 0;
function popup(d){
  const others = d.others.length ? '<div class="m">Other posts: ' + d.others.map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+(i+1)+'</a>').join(' ') + '</div>' : '';
  return '<div class="pop"><h3>'+esc(d.loc)+'</h3>'
   + '<div><b>'+esc(d.date)+'</b> <span class="tag'+(d.cert==='Approximate'?' ap':'')+'">'+esc(d.cert)+' date</span></div>'
   + '<div style="margin-top:4px">'+esc(d.ev)+'</div>'
   + '<div class="m">Position: '+esc(d.prec)+(d.pnote?' - '+esc(d.pnote):'')+'</div>'
   + (d.notes?'<div class="m">Note: '+esc(d.notes)+'</div>':'')
   + '<div class="m"><a href="'+esc(d.link)+'" target="_blank" rel="noopener">Original post</a> (published '+esc(d.postdate)+')</div>'+others+'</div>';
}
const markers = DATA.map(d => {
  const k = cat(d.year), e = est(d);
  const m = L.circleMarker([d.lat, d.lon], {radius:8, color:COL[k], weight:2, fillColor:COL[k], fillOpacity:e?0.15:0.8, dashArray:e?'3 3':null});
  m.bindPopup(popup(d)); m.d = d; return m;
});
const listEl = document.getElementById('list'), countEl = document.getElementById('count');
function visible(d){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const years = [...document.querySelectorAll('.fy')].filter(x=>x.checked).map(x=>x.value);
  if(!years.includes(cat(d.year))) return false;
  if(document.getElementById('onlyc').checked && d.cert!=='Certain') return false;
  if(document.getElementById('onlyp').checked && est(d)) return false;
  if(q && !(d.loc+' '+d.ev+' '+d.date).toLowerCase().includes(q)) return false;
  return true;
}
function refresh(){
  group.clearLayers(); listEl.innerHTML=''; let n=0;
  markers.forEach(m => { if(visible(m.d)){ n++; group.addLayer(m);
    const row = document.createElement('div'); row.className='item';
    row.innerHTML = '<b>'+esc(m.d.loc)+'</b><span>'+esc(m.d.date)+' &middot; '+esc(m.d.cert)+' &middot; '+esc(m.d.ev)+'</span>';
    row.onclick = () => { map.setView(m.getLatLng(), Math.max(map.getZoom(),6)); m.openPopup(); };
    listEl.appendChild(row); }});
  countEl.textContent = n + ' of ' + DATA.length + ' events shown';
}
document.querySelectorAll('#ctl input').forEach(i => i.addEventListener('input', refresh));
const lg = L.control({position:'bottomright'});
lg.onAdd = () => { const d = L.DomUtil.create('div','legend');
  d.innerHTML = '<span class="dot" style="background:#c0392b"></span> 2026<br><span class="dot" style="background:#e67e22"></span> 2025<br><span class="dot" style="background:#2e86c1"></span> 2024<br><span class="dot" style="background:#5d6d7e"></span> before 2024<br><span class="dot" style="border:2px dashed #888;width:13px;height:13px"></span> estimated position'; return d; };
lg.addTo(map);
refresh();
map.fitBounds(L.latLngBounds(DATA.map(d=>[d.lat,d.lon])).pad(0.05));
</script></body></html>
